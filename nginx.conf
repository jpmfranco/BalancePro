server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ✅ Esto redirige todas las rutas a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ✅ Permite peticiones al backend sin bloquearlas
    location /api/ {
        proxy_pass http://csharp-api:8080;
    }
}