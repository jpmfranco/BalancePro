<!-- Header -->
<header class="header">
  <div class="header-content">
    <div class="logo">💰 Balance Pro</div>
    <button class="mobile-menu-toggle" (click)="toggleMenu()">☰</button>
    <ul class="nav-menu" [class.active]="menuOpen()">
      <li><a href="javascript:void(0)" routerLink="" (click)="navigateTo('overview')">Overview</a></li>
      <li><a href="javascript:void(0)"  routerLink="busqueda" (click)="navigateTo('busqueda')">Búsqueda</a></li>
      <li><a href="javascript:void(0)" routerLink="prediccion" (click)="navigateTo('proyeccion')">Proyección</a></li>
      <li><a href="javascript:void(0)" routerLink="prediccion" (click)="navigateTo('perfil')">Perfil</a></li>
      <li><a href="javascript:void(0)" class="logout-btn" (click)="logout()">Cerrar sesión</a></li>
    </ul>
  </div>
</header>

<div class="form-container">
  <div class="form-card">
    <div class="form-header">
      <h2>💵 Registrar Ingreso</h2>
      <p>Agrega un nuevo ingreso a tu cuenta</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="ingreso-form">
      <!-- Descripción -->
      <div class="form-group">
        <label for="descripcion">Descripción *</label>
        <input
          type="text"
          id="descripcion"
          [value]="ingreso().descripcion"
          (input)="updateField('descripcion', $any($event.target).value)"
          placeholder="Ej: Salario mensual, Venta producto, etc."
          [disabled]="isLoading()"
          required
        />
      </div>

      <!-- Fecha -->
      <div class="form-group">
        <label for="fecha">Fecha *</label>
        <input
          type="date"
          id="fecha"
          [value]="ingreso().fecha"
          (input)="updateField('fecha', $any($event.target).value)"
          [disabled]="isLoading()"
          required
        />
      </div>

      <!-- Monto -->
      <div class="form-group">
        <label for="monto">Monto *</label>
        <div class="input-with-prefix">
          <span class="prefix">$</span>
          <input
            type="number"
            id="monto"
            [value]="ingreso().monto"
            (input)="updateField('monto', +$any($event.target).value)"
            placeholder="0.00"
            step="0.01"
            min="0"
            [disabled]="isLoading()"
            required
          />
        </div>
      </div>

      <!-- Mensaje de error -->
      @if (errorMessage()) {
        <div class="error-message">
          <span>⚠️ {{ errorMessage() }}</span>
        </div>
      }

      <!-- Mensaje de éxito -->
      @if (successMessage()) {
        <div class="success-message">
          <span>✅ {{ successMessage() }}</span>
        </div>
      }

      <!-- Botones -->
      <div class="form-actions">
        <button 
          type="button" 
          class="cancel-button"
          (click)="navigateTo('overview')"
          [disabled]="isLoading()"
        >
          Cancelar
        </button>
        <button 
          type="submit" 
          class="submit-button"
          [disabled]="isLoading()"
        >
          @if (!isLoading()) {
            <span>Guardar Ingreso</span>
          } @else {
            <span>⏳ Guardando...</span>
          }
        </button>
      </div>
    </form>
  </div>
</div>
