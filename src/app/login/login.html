<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Balance Pro</h1>
      <p>Inicia sesión para continuar</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <!-- Usuario -->
      <div class="form-group">
        <label for="username">Correo</label>
        <input
          type="text"
          id="username"
          name="username"
          [value]="correo()"
          (input)="updatecorreo($any($event.target).value)"
          (focus)="clearError()"
          placeholder="Ingresa tu correo"
          [disabled]="isLoading()"
          autocomplete="username"
          required
        />
      </div>

      <!-- Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [value]="password()"
          (input)="updatePassword($any($event.target).value)"
          (focus)="clearError()"
          placeholder="Ingresa tu contraseña"
          [disabled]="isLoading()"
          autocomplete="current-password"
          required
        />
      </div>

      <!-- Mensaje de error -->
      @if (errorMessage()) {
        <div class="error-message">
          <span>⚠️ {{ errorMessage() }}</span>
        </div>
      }

      <!-- Botón de submit -->
      <button 
        type="submit" 
        class="login-button"
        [disabled]="isLoading()"
      >
        @if (!isLoading()) {
          <span>Iniciar sesión</span>
        } @else {
          <span class="loading-spinner">⏳ Cargando...</span>
        }
      </button>
    </form>

    <div class="login-footer">
      <a href="javascript:void(0)">¿Olvidaste tu contraseña?</a>
    </div>

    <!-- Registro -->
    <div class="register">
      <p>¿No tienes cuenta? Registrate dando click<button (click)="GotoRegister()">aquí</button></p>
    </div>
  </div>
</div>
